<!DOCTYPE html>
<html lang="id">
<head>

<meta charset="UTF-8" />
<meta name="viewport"
content="width=device-width, initial-scale=1.0, maximum-scale=1.0">

<title>Jejak Karyaku 🎨</title>

<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/js/all.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
    font-family:'Fredoka',sans-serif;
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

body{
    background:#fff9fb;
    color:#334155;
    overflow-x:hidden;
}

.card{
    background:white;
    border-radius:24px;
    box-shadow:0 8px 30px rgba(0,0,0,.06);
}

.kids-btn{
    border-radius:18px;
    font-weight:700;
    transition:.2s;
}

.kids-btn:active{
    transform:scale(.96);
}

.btn-primary{
    background:#ff6b9d;
    color:white;
}

.btn-secondary{
    background:#60a5fa;
    color:white;
}

.gallery-slider{
    display:flex;
    overflow-x:auto;
    gap:1rem;
    scroll-snap-type:x mandatory;
    padding-bottom:1rem;
}

.gallery-slider::-webkit-scrollbar{
    display:none;
}

.gallery-card{
    min-width:100%;
    scroll-snap-align:start;
}

@media(min-width:768px){
    .gallery-card{
        min-width:calc(50% - .5rem);
    }
}

.modal{
    background:rgba(0,0,0,.55);
    backdrop-filter:blur(8px);
}

</style>

</head>

<body class="min-h-screen pb-10">

<!-- LOADING -->

<div id="loading"
class="hidden fixed inset-0 z-50 flex items-center justify-center bg-white/90">

    <div class="text-center">

        <div class="animate-spin w-16 h-16 border-4 border-pink-400 border-t-transparent rounded-full mx-auto"></div>

        <p class="mt-4 font-black text-pink-500">
            Memuat...
        </p>

    </div>

</div>

<!-- NAVBAR -->

<nav class="sticky top-0 z-40 p-3">

    <div class="max-w-6xl mx-auto bg-white rounded-3xl shadow-lg p-4 flex justify-between items-center">

        <h1 class="text-2xl font-black text-pink-500">
            JejakKaryaku 🎨
        </h1>

        <div class="flex gap-2">

            <button onclick="showView('home')"
            class="px-4 py-2 rounded-xl hover:bg-pink-50 font-bold">

                Beranda

            </button>

            <button id="admin-nav-btn"
                onclick="openLogin()"
                class="relative kids-btn btn-secondary px-5 py-2">

                <span id="admin-btn-label">
                    Guru 🍎
                </span>

                <span id="notif-floating"
                class="hidden absolute -top-2 -right-2 bg-red-500 text-white text-[10px] min-w-[22px] h-[22px] px-1 rounded-full flex items-center justify-center font-black border-2 border-white">

                    0

                </span>

            </button>

        </div>

    </div>

</nav>

<!-- MAIN -->

<main class="max-w-6xl mx-auto px-4">

<!-- HOME -->

<section id="view-home"
class="view space-y-8">

    <div class="text-center py-8">

        <h2 class="text-5xl font-black text-slate-800">
            Galeri Teman Hebat 🌈
        </h2>

        <p class="text-slate-400 mt-2 font-bold">
            Swipe untuk melihat karya
        </p>

    </div>

    <div id="student-grid"
    class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-5 gap-4"></div>

</section>

<!-- GALLERY -->

<section id="view-gallery"
class="view hidden space-y-5">

    <button onclick="showView('home')"
    class="kids-btn bg-white px-5 py-3 rounded-2xl shadow font-bold">

        ← Kembali

    </button>

    <div id="gallery-header"
    class="card p-6"></div>

    <div id="gallery-grid"
    class="gallery-slider"></div>

</section>

<!-- ADMIN -->

<section id="view-admin"
class="view hidden space-y-5">

    <div class="card p-5 flex justify-between items-center">

        <h2 class="text-3xl font-black">
            Dashboard Guru 🍏
        </h2>

        <button onclick="logout()"
        class="text-red-400 font-bold">

            Keluar

        </button>

    </div>

    <div class="grid lg:grid-cols-3 gap-5">

        <!-- SISWA -->

        <div class="space-y-4">

            <button onclick="showModal('modal-student')"
            class="kids-btn btn-primary w-full py-4 text-lg">

                + Tambah Murid

            </button>

            <div id="admin-student-list"
            class="space-y-3"></div>

        </div>

        <!-- INBOX -->

        <div class="lg:col-span-2 card p-6">

            <div class="flex items-center justify-between mb-4">

                <h3 class="text-2xl font-black">
                    Inbox Orang Tua 💌
                </h3>

                <div id="notif-badge"
                class="bg-red-500 text-white px-3 py-1 rounded-full text-sm font-black">

                    0 Baru

                </div>

            </div>

            <div id="admin-comment-log"
            class="space-y-4"></div>

        </div>

    </div>

</section>

</main>

<!-- LOGIN MODAL -->

<div id="modal-login"
class="hidden fixed inset-0 modal z-50 flex items-center justify-center p-4">

    <div class="bg-white rounded-3xl p-7 w-full max-w-sm">

        <h3 class="text-3xl font-black text-center mb-6">
            Login Guru 🍎
        </h3>

        <div class="space-y-3">

            <input id="login-user"
            type="text"
            placeholder="Username"
            class="w-full p-4 rounded-2xl bg-slate-100 outline-none">

            <input id="login-pass"
            type="password"
            placeholder="Password"
            class="w-full p-4 rounded-2xl bg-slate-100 outline-none">

            <button onclick="handleLogin()"
            class="kids-btn btn-secondary w-full py-4 text-lg">

                Login

            </button>

        </div>

    </div>

</div>

<script>

const API_URL =
'https://script.google.com/macros/s/AKfycbyqAxfoUYm9KpUiq90Y9hjYNNzJhOSjCfxmEEN9bPNomSzq2XMiLAfw5GgtEU3TPOz1/exec';

let appData = {
    students:[]
};

let isAdminLoggedIn = false;
let currentStudentId = null;

function toggleLoading(v){

    document
    .getElementById('loading')
    .classList.toggle('hidden', !v);

}

function showModal(id){

    document
    .getElementById(id)
    .classList.remove('hidden');

}

function hideModal(id){

    document
    .getElementById(id)
    .classList.add('hidden');

}

function showView(id){

    document.querySelectorAll('.view')
    .forEach(v=>v.classList.add('hidden'));

    document
    .getElementById('view-'+id)
    .classList.remove('hidden');

    window.scrollTo({
        top:0,
        behavior:'smooth'
    });

}

async function fetchData(){

    toggleLoading(true);

    try {

        const res = await fetch(API_URL,{
            method:'POST',
            body:JSON.stringify({
                action:'getInitialData'
            })
        });

        const json = await res.json();

        if(json.success){

            appData.students =
                json.data || [];

            renderHome();

            if(isAdminLoggedIn){

                renderAdmin();

            }

        }

    } catch(err){

        console.log(err);

    }

    toggleLoading(false);

}

function renderHome(){

    const grid =
        document.getElementById('student-grid');

    if(!appData.students.length){

        grid.innerHTML = `
            <div class="col-span-full text-center py-20 text-slate-400 font-bold">
                Belum ada siswa
            </div>
        `;

        return;
    }

    grid.innerHTML =
    appData.students.map(s=>`

        <div onclick="renderGallery('${s.id}')"
        class="card p-4 text-center cursor-pointer">

            <img loading="lazy"
            src="${s.foto || 'https://ui-avatars.com/api/?name='+encodeURIComponent(s.nama)}"
            class="w-full aspect-square rounded-2xl object-cover mb-3">

            <h3 class="font-black truncate">
                ${s.nama}
            </h3>

            <p class="text-xs text-slate-400 mt-1 font-bold">
                ${s.karya.length} karya
            </p>

        </div>

    `).join('');

}

function renderGallery(id){

    currentStudentId = id;

    const s =
        appData.students.find(x=>x.id===id);

    if(!s) return;

    document.getElementById('gallery-header').innerHTML = `
        <div class="flex items-center gap-5">

            <img src="${s.foto || 'https://ui-avatars.com/api/?name='+s.nama}"
            class="w-28 h-28 rounded-3xl object-cover shadow-lg">

            <div>

                <h2 class="text-4xl font-black text-pink-500">
                    ${s.nama}
                </h2>

                <p class="text-slate-400 font-bold mt-1">
                    ${s.karya.length} karya hebat ✨
                </p>

            </div>

        </div>
    `;

    document.getElementById('gallery-grid').innerHTML =
    s.karya.map(k=>`

        <div class="gallery-card card overflow-hidden">

            <img src="${k.thumb}"
            class="w-full aspect-[4/3] object-cover">

            <div class="p-5">

                <div class="flex justify-between items-start gap-3 mb-3">

                    <h3 class="text-xl font-black">
                        ${k.judul}
                    </h3>

                    <span class="text-xs text-slate-400 font-bold">
                        ${new Date(k.date).toLocaleDateString('id-ID')}
                    </span>

                </div>

            </div>

        </div>

    `).join('');

    showView('gallery');

}

function openLogin(){

    if(isAdminLoggedIn){

        showView('admin');
        return;

    }

    showModal('modal-login');

}

async function handleLogin(){

    const u =
        document.getElementById('login-user').value;

    const p =
        document.getElementById('login-pass').value;

    if(u==='admin' && p==='guru123'){

        isAdminLoggedIn = true;

        hideModal('modal-login');

        document.getElementById('admin-btn-label')
        .innerText = 'Dashboard 🏠';

        renderAdmin();

        showView('admin');

    } else {

        alert('Login salah');

    }

}

function logout(){

    isAdminLoggedIn = false;

    document.getElementById('admin-btn-label')
    .innerText = 'Guru 🍎';

    showView('home');

}

function renderAdmin(){

    renderStudentList();

    renderCommentInbox();

}

function renderStudentList(){

    const wrap =
        document.getElementById('admin-student-list');

    wrap.innerHTML =
    appData.students.map(s=>`

        <div class="card p-4">

            <div class="flex justify-between items-center gap-3">

                <div class="flex items-center gap-3">

                    <img src="${s.foto || 'https://ui-avatars.com/api/?name='+s.nama}"
                    class="w-14 h-14 rounded-2xl object-cover">

                    <div>

                        <p class="font-black">
                            ${s.nama}
                        </p>

                        <p class="text-xs text-slate-400 font-bold">
                            ${s.karya.length} karya
                        </p>

                    </div>

                </div>

            </div>

        </div>

    `).join('');

}

function renderCommentInbox(){

    const wrap =
        document.getElementById('admin-comment-log');

    let allComments = [];

    appData.students.forEach(s=>{

        (s.percakapan || []).forEach(c=>{

            const karya =
                s.karya.find(k=>k.id===c.workId);

            allComments.push({
                ...c,
                student:s,
                karya
            });

        });

    });

    const unreplyCount =
        allComments.filter(x=>!x.balasanGuru).length;

    document.getElementById('notif-badge')
    .innerText = `${unreplyCount} Baru`;

    const floating =
        document.getElementById('notif-floating');

    if(unreplyCount > 0){

        floating.classList.remove('hidden');
        floating.innerText = unreplyCount;

    } else {

        floating.classList.add('hidden');

    }

    if(!allComments.length){

        wrap.innerHTML = `
            <div class="bg-slate-50 rounded-3xl p-10 text-center text-slate-400 font-bold">
                Belum ada pesan
            </div>
        `;

        return;
    }

    wrap.innerHTML =
    allComments.map(c=>`

        <div class="bg-slate-50 rounded-3xl p-4">

            <div class="flex items-center gap-3 mb-4">

                <img src="${c.student.foto || 'https://ui-avatars.com/api/?name='+c.student.nama}"
                class="w-14 h-14 rounded-2xl object-cover">

                <div>

                    <h4 class="font-black text-lg">
                        ${c.student.nama}
                    </h4>

                    <p class="text-sm text-slate-400 font-bold">
                        ${c.karya?.judul || ''}
                    </p>

                </div>

            </div>

            <div class="bg-white rounded-2xl p-4">

                <p class="text-xs font-black text-blue-500 mb-1">
                    Pesan Orang Tua
                </p>

                <p class="font-medium">
                    ${c.pesanWali}
                </p>

            </div>

        </div>

    `).join('');

}

window.onload = ()=>{
    fetchData();
};

</script>

</body>
</html>
