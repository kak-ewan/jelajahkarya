<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Jejak Karyaku 🎨 Galeri Ceria</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --p-pink: #FF85A1;
            --p-blue: #74C0FC;
            --p-yellow: #FFD43B;
            --p-green: #8ce99a;
            --p-purple: #bac8ff;
            --bg-soft: #fff9f9;
        }

        body { 
            font-family: 'Fredoka', sans-serif; 
            background-color: var(--bg-soft);
            background-image: radial-gradient(#ffe3e3 1px, transparent 1px);
            background-size: 20px 20px;
            color: #495057;
            -webkit-tap-highlight-color: transparent;
        }

        .kids-card {
            background: white;
            border-radius: 2.5rem;
            border: 4px solid transparent;
            box-shadow: 0 8px 0px rgba(0, 0, 0, 0.05);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .kids-card:hover {
            transform: scale(1.05) rotate(2deg);
            border-color: var(--p-pink);
            box-shadow: 0 15px 20px rgba(255, 133, 161, 0.2);
        }

        .kids-btn {
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            font-weight: 700;
            border-radius: 1.5rem;
            box-shadow: 0 4px 0px rgba(0,0,0,0.1);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }

        .kids-btn:active {
            transform: translateY(4px);
            box-shadow: 0 0px 0px rgba(0,0,0,0.1);
        }

        .btn-primary { background: var(--p-pink); color: white; }
        .btn-secondary { background: var(--p-blue); color: white; }
        .btn-accent { background: var(--p-yellow); color: #856404; }

        .chat-bubble-parent {
            background: #fff;
            border: 2px solid var(--p-blue);
            border-radius: 1.5rem 1.5rem 1.5rem 0.2rem;
            padding: 1rem;
            position: relative;
        }

        .chat-bubble-teacher {
            background: var(--p-green);
            color: #1b4332;
            border-radius: 1.5rem 1.5rem 0.2rem 1.5rem;
            padding: 1rem;
            margin-left: 2rem;
        }
    </style>
</head>
<body class="min-h-screen pb-10">

    <!-- LOADING SCREEN -->
    <div id="loading" class="fixed inset-0 bg-white/95 z-[100] hidden flex flex-col items-center justify-center">
        <div class="relative w-24 h-24">
            <div class="absolute inset-0 border-8 border-pink-100 rounded-full"></div>
            <div class="absolute inset-0 border-8 border-pink-500 border-t-transparent rounded-full animate-spin"></div>
            <div class="absolute inset-0 flex items-center justify-center text-3xl">🚀</div>
        </div>
        <p class="font-bold text-pink-600 mt-6 text-xl text-center px-4">Memproses... <br>Pastikan koneksi internet stabil ya! ✨</p>
    </div>

    <!-- NAVIGATION -->
    <nav class="p-4 sticky top-0 z-40">
        <div class="max-w-6xl mx-auto bg-white/90 backdrop-blur-md shadow-xl rounded-[2rem] p-4 flex justify-between items-center border-b-4 border-slate-100">
            <div class="flex items-center gap-3 cursor-pointer group" onclick="showView('home')">
                <div class="bg-pink-100 p-2 rounded-2xl group-hover:rotate-12 transition-transform">
                    <span class="text-3xl">🌈</span>
                </div>
                <span class="font-black text-2xl tracking-tight text-slate-800">Jejak<span class="text-pink-500">Karyaku</span></span>
            </div>
            <div class="flex gap-2">
                <button id="admin-nav-btn" onclick="openLogin()" class="kids-btn btn-secondary px-6 py-2">Guru 🍎</button>
            </div>
        </div>
    </nav>

    <main class="max-w-6xl mx-auto p-4">
        <!-- VIEW: BERANDA -->
        <section id="view-home" class="view space-y-12">
            <div class="text-center py-12">
                <h1 class="text-4xl md:text-6xl font-black text-slate-800 mb-4 leading-tight">
                    Galeri Teman <span class="text-pink-500">Hebat!</span> 🌟
                </h1>
                <p class="text-lg md:text-xl text-slate-500 font-medium">Klik fotomu untuk melihat mahakaryamu!</p>
            </div>
            <div id="student-grid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-6 md:gap-8"></div>
        </section>

        <!-- VIEW: GALERI SISWA -->
        <section id="view-gallery" class="view hidden space-y-8">
            <button onclick="showView('home')" class="kids-btn bg-white px-6 py-3 text-slate-500 border-2 border-slate-100 flex items-center gap-2 hover:bg-slate-50">
                <i class="fas fa-chevron-left"></i> Kembali Main
            </button>
            <div id="gallery-header" class="bg-white p-6 md:p-8 rounded-[3rem] shadow-xl border-b-8 border-blue-100 flex flex-col md:flex-row items-center gap-6 md:gap-8 text-center md:text-left"></div>
            <div id="gallery-grid" class="grid grid-cols-1 md:grid-cols-2 gap-8 md:gap-10"></div>
        </section>

        <!-- VIEW: ADMIN PANEL -->
        <section id="view-admin" class="view hidden space-y-8">
            <div class="flex flex-col md:flex-row justify-between items-center bg-white p-6 rounded-[2.5rem] shadow-sm gap-4">
                <h2 class="text-3xl font-black text-slate-800">Ruang Guru 🍏</h2>
                <div class="flex gap-3">
                    <button onclick="runSetup()" class="kids-btn bg-yellow-400 text-white px-4 py-2"><i class="fas fa-tools"></i> Reset & Setup</button>
                    <button onclick="fetchData()" class="kids-btn bg-slate-100 text-slate-600 px-4 py-2"><i class="fas fa-sync"></i> Refresh</button>
                    <button onclick="logout()" class="text-red-400 font-bold px-4 py-2 hover:bg-red-50 rounded-xl">Keluar</button>
                </div>
            </div>
            <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
                <div class="lg:col-span-1 space-y-4">
                    <button onclick="showModal('modal-student')" class="w-full kids-btn btn-primary p-5 text-lg">
                        <i class="fas fa-user-plus"></i> Tambah Murid Baru
                    </button>
                    <div id="admin-student-list" class="space-y-4 max-h-[600px] overflow-y-auto pr-2"></div>
                </div>
                <div class="lg:col-span-2 bg-white p-6 md:p-8 rounded-[2.5rem] shadow-xl border-t-8 border-yellow-300">
                    <h3 class="font-black text-2xl mb-6">💌 Pesan Baru</h3>
                    <div id="admin-comment-log" class="space-y-6 max-h-[700px] overflow-y-auto pr-4"></div>
                </div>
            </div>
        </section>
    </main>

    <!-- MODALS -->
    <!-- Modal Login -->
    <div id="modal-login" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white p-8 md:p-10 rounded-[3rem] w-full max-w-sm shadow-2xl">
            <h3 class="text-3xl font-black text-center mb-6">Halo Guru! 🔑</h3>
            <div class="space-y-4">
                <input type="text" id="login-user" placeholder="Username" class="w-full p-4 bg-slate-50 rounded-2xl font-bold border-2 border-transparent focus:border-blue-400 outline-none">
                <input type="password" id="login-pass" placeholder="Password" class="w-full p-4 bg-slate-50 rounded-2xl font-bold border-2 border-transparent focus:border-blue-400 outline-none">
                <button onclick="handleLogin()" class="w-full kids-btn btn-secondary py-4 text-xl">Masuk ✨</button>
                <button onclick="hideModal('modal-login')" class="w-full text-slate-400 font-bold">Tutup</button>
            </div>
        </div>
    </div>

    <!-- Modal Upload -->
    <div id="modal-upload" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-[3rem] w-full max-w-2xl max-h-[90vh] overflow-hidden flex flex-col shadow-2xl">
            <div class="p-6 border-b flex justify-between items-center bg-pink-50">
                <h3 id="upload-modal-title" class="font-black text-2xl">Koleksi Karya</h3>
                <button onclick="hideModal('modal-upload')" class="text-slate-400 text-2xl"><i class="fas fa-times"></i></button>
            </div>
            <div class="p-6 md:p-8 overflow-y-auto space-y-8">
                <div class="bg-slate-50 p-6 rounded-[2rem] space-y-4">
                    <input type="text" id="up-judul" placeholder="Judul karya..." class="w-full p-4 rounded-2xl font-bold outline-none">
                    <div class="relative group">
                        <label for="up-file" class="flex flex-col items-center justify-center w-full h-32 border-4 border-dashed border-pink-200 rounded-[2rem] bg-white cursor-pointer hover:bg-pink-50 hover:border-pink-400 transition-all">
                            <div class="flex flex-col items-center justify-center pt-5 pb-6 text-pink-500">
                                <i class="fas fa-cloud-upload-alt text-3xl mb-2"></i>
                                <p id="file-label-text" class="text-sm font-bold">Pilih foto karya ceria</p>
                                <p class="text-xs text-slate-400 mt-1">(Maksimal 5MB)</p>
                            </div>
                            <input type="file" id="up-file" accept="image/*" class="hidden" onchange="updateFileLabel()">
                        </label>
                    </div>
                    <button onclick="processUpload()" class="kids-btn btn-primary w-full py-4 text-lg">Unggah Ke Galeri 🚀</button>
                </div>
                <div id="admin-work-list" class="space-y-2"></div>
            </div>
        </div>
    </div>

    <!-- Modal PIN -->
    <div id="modal-pin" class="fixed inset-0 bg-pink-500/80 backdrop-blur-md z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white p-8 md:p-10 rounded-[3.5rem] w-full max-w-sm text-center shadow-2xl">
            <div id="pin-avatar" class="w-24 h-24 mx-auto rounded-[2.5rem] mb-6 border-4 border-pink-100 overflow-hidden bg-white shadow-lg"></div>
            <h3 id="pin-name" class="text-2xl font-black mb-2">Halo!</h3>
            <input type="password" id="input-pin" inputmode="numeric" placeholder="••••" class="w-full p-5 bg-slate-50 rounded-3xl mb-6 text-center text-4xl font-black tracking-widest text-pink-500 outline-none">
            <button onclick="verifyPin()" class="w-full kids-btn btn-primary py-5 text-2xl">Buka Galeri 🎨</button>
            <button onclick="hideModal('modal-pin')" class="mt-4 font-bold text-slate-300">Kembali</button>
        </div>
    </div>

    <!-- Modal Student -->
    <div id="modal-student" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white p-8 rounded-[3rem] w-full max-w-sm">
            <h3 class="text-2xl font-black mb-6">👶 Data Murid</h3>
            <div class="space-y-4">
                <input type="text" id="st-nama" placeholder="Nama Murid" class="w-full p-4 bg-slate-50 rounded-2xl font-bold outline-none">
                <input type="text" id="st-pass" placeholder="Password PIN" class="w-full p-4 bg-slate-50 rounded-2xl font-bold outline-none">
                <input type="text" id="st-foto" placeholder="Link Foto Profil (Opsional)" class="w-full p-4 bg-slate-50 rounded-2xl font-bold outline-none">
                <button onclick="saveStudent()" class="w-full kids-btn bg-green-400 text-white py-4 text-xl mt-4">Simpan ✅</button>
                <button onclick="hideModal('modal-student')" class="w-full text-slate-400 font-bold">Batal</button>
            </div>
        </div>
    </div>

    <script>
        // URL Web App Terbaru
        const API_URL = "https://script.google.com/macros/s/AKfycbyqAxfoUYm9KpUiq90Y9hjYNNzJhOSjCfxmEEN9bPNomSzq2XMiLAfw5GgtEU3TPOz1/exec"; 
        
        let appData = { students: [] };
        let isAdminLoggedIn = false;
        let currentStudentId = null;

        function toggleLoading(s) { document.getElementById('loading').classList.toggle('hidden', !s); }
        function showModal(id) { document.getElementById(id).classList.remove('hidden'); }
        function hideModal(id) { document.getElementById(id).classList.add('hidden'); }
        
        function showView(id) {
            document.querySelectorAll('.view').forEach(v => v.classList.add('hidden'));
            document.getElementById('view-' + id).classList.remove('hidden');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // Fungsi baru untuk label file
        function updateFileLabel() {
            const file = document.getElementById('up-file').files[0];
            const text = document.getElementById('file-label-text');
            if (file) {
                text.innerText = file.name;
                text.classList.add('text-blue-500');
            } else {
                text.innerText = "Pilih foto karya ceria";
                text.classList.remove('text-blue-500');
            }
        }

        /**
         * Fungsi helper fetch dengan retry logic untuk menangani network error
         */
        async function fetchWithRetry(url, options, retries = 3, backoff = 1000) {
            try {
                const response = await fetch(url, options);
                if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
                return await response.json();
            } catch (error) {
                if (retries > 0) {
                    await new Promise(resolve => setTimeout(resolve, backoff));
                    return fetchWithRetry(url, options, retries - 1, backoff * 2);
                }
                throw error;
            }
        }

        async function fetchData() {
            toggleLoading(true);
            try {
                const result = await fetchWithRetry(API_URL, {
                    method: 'POST',
                    body: JSON.stringify({ action: 'getInitialData' }),
                    mode: 'cors'
                });

                if (result && result.success) {
                    appData.students = result.data || [];
                    renderHome();
                    if (isAdminLoggedIn) renderAdmin();
                } else {
                    console.error("Data Error:", result?.message);
                }
            } catch (error) {
                console.error("Final Network Error:", error);
                const grid = document.getElementById('student-grid');
                grid.innerHTML = `<div class="col-span-full text-center p-10 bg-red-50 rounded-3xl">
                    <p class="font-bold text-red-500">Oops! Gagal terhubung ke server 🌐</p>
                    <p class="text-sm text-red-400 mt-2">Coba periksa koneksi internet atau pastikan URL Apps Script sudah benar.</p>
                    <button onclick="fetchData()" class="mt-4 kids-btn btn-secondary px-6 py-2">Coba Lagi</button>
                </div>`;
            }
            toggleLoading(false);
        }

        async function runSetup() {
            if(!confirm("Ini akan menghapus semua data dan mengatur ulang kolom database. Lanjutkan?")) return;
            toggleLoading(true);
            try {
                const result = await fetchWithRetry(API_URL, { 
                    method: 'POST', 
                    body: JSON.stringify({ action: 'setup' }),
                    mode: 'cors'
                });
                alert(result.message);
                fetchData();
            } catch(e) { alert("Setup Gagal: Pastikan URL Apps Script sudah benar."); }
            toggleLoading(false);
        }

        function openLogin() { 
            if (isAdminLoggedIn) showView('admin'); 
            else showModal('modal-login'); 
        }
        
        function handleLogin() {
            const u = document.getElementById('login-user').value;
            const p = document.getElementById('login-pass').value;
            if (u === "admin" && p === "guru123") {
                isAdminLoggedIn = true;
                hideModal('modal-login');
                document.getElementById('admin-nav-btn').innerText = "Dashboard 🏠";
                renderAdmin();
                showView('admin');
            } else { 
                alert("Login Salah!"); 
            }
        }

        function logout() {
            isAdminLoggedIn = false;
            document.getElementById('admin-nav-btn').innerText = "Guru 🍎";
            showView('home');
        }

        function renderHome() {
            const grid = document.getElementById('student-grid');
            if (!appData.students.length) {
                grid.innerHTML = `<p class="col-span-full text-center text-slate-400 py-10">Belum ada data murid. Silakan tambah di Panel Guru.</p>`;
                return;
            }
            grid.innerHTML = appData.students.map((s, idx) => `
                <div onclick="askPin('${s.id}')" class="kids-card p-4 text-center cursor-pointer">
                    <div class="relative mb-4">
                        <img src="${s.foto || 'https://ui-avatars.com/api/?background=random&name='+s.nama}" class="w-full aspect-square object-cover rounded-[2rem] border-4 border-white shadow-md">
                    </div>
                    <h3 class="font-black text-slate-700 truncate">${s.nama}</h3>
                    <p class="text-[10px] font-bold text-pink-500 uppercase">${s.karya ? s.karya.length : 0} Karya</p>
                </div>
            `).join('');
        }

        function askPin(id) {
            currentStudentId = id;
            const s = appData.students.find(x => x.id === id);
            document.getElementById('pin-name').innerText = `Halo, ${s.nama}!`;
            document.getElementById('pin-avatar').innerHTML = `<img src="${s.foto || 'https://ui-avatars.com/api/?background=random&name='+s.nama}" class="w-full h-full object-cover">`;
            document.getElementById('input-pin').value = "";
            showModal('modal-pin');
        }

        function verifyPin() {
            const s = appData.students.find(x => x.id === currentStudentId);
            const pin = document.getElementById('input-pin').value;
            if (String(s.pass) === pin) {
                hideModal('modal-pin');
                renderGallery(currentStudentId);
            } else { 
                alert("PIN Salah!");
            }
        }

        function renderGallery(id) {
            const s = appData.students.find(x => x.id === id);
            currentStudentId = id;
            document.getElementById('gallery-header').innerHTML = `
                <img src="${s.foto || 'https://ui-avatars.com/api/?background=random&name='+s.nama}" class="w-32 h-32 rounded-[2.5rem] object-cover border-4 border-white shadow-xl">
                <div>
                    <h2 class="text-3xl font-black">Galeri ${s.nama}</h2>
                    <p class="font-bold text-slate-400 italic">"Goresan indah penuh makna!"</p>
                </div>
            `;
            
            const grid = document.getElementById('gallery-grid');
            if (!s.karya || !s.karya.length) {
                grid.innerHTML = `<p class="col-span-full text-center text-slate-400 py-20 bg-white rounded-[3rem]">Belum ada karya yang diunggah. ✨</p>`;
            } else {
                grid.innerHTML = s.karya.map(k => {
                    const comments = s.percakapan ? s.percakapan.filter(p => p.workId === k.id) : [];
                    const displayImg = k.thumb === "ICON_FALLBACK" ? `<div class="w-full aspect-video bg-slate-100 flex items-center justify-center text-5xl">📄</div>` : `<img src="${k.link}" class="w-full aspect-video object-cover">`;

                    return `
                    <div class="bg-white rounded-[3rem] overflow-hidden shadow-xl border-t-8 border-pink-400">
                        ${displayImg}
                        <div class="p-6 space-y-4">
                            <h4 class="font-black text-xl">${k.judul}</h4>
                            <div class="space-y-3">
                                ${comments.map(c => `
                                    <div class="chat-bubble-parent">
                                        <p class="text-[10px] font-black text-blue-500 uppercase">Wali Murid:</p>
                                        <p class="font-bold text-sm">${c.pesanWali}</p>
                                    </div>
                                    ${c.balasanGuru ? `<div class="chat-bubble-teacher"><p class="font-bold text-sm">${c.balasanGuru}</p></div>` : ''}
                                `).join('')}
                            </div>
                            <div class="flex gap-2">
                                <input type="text" id="input-chat-${k.id}" placeholder="Beri apresiasi..." class="flex-1 p-3 bg-slate-50 rounded-xl font-bold outline-none">
                                <button onclick="sendComment('${k.id}')" class="kids-btn btn-primary px-4"><i class="fas fa-paper-plane"></i></button>
                            </div>
                        </div>
                    </div>
                `}).join('');
            }
            showView('gallery');
        }

        async function sendComment(wId) {
            const input = document.getElementById(`input-chat-${wId}`);
            if (!input.value.trim()) return;
            toggleLoading(true);
            try {
                await fetchWithRetry(API_URL, { 
                    method: 'POST', 
                    body: JSON.stringify({ action: 'addComment', workId: wId, studentId: currentStudentId, comment: input.value }),
                    mode: 'cors'
                });
                await fetchData();
                renderGallery(currentStudentId);
            } catch(e) { alert("Gagal kirim pesan"); }
            toggleLoading(false);
        }

        function renderAdmin() {
            document.getElementById('admin-student-list').innerHTML = appData.students.map(s => `
                <div class="bg-white p-4 rounded-3xl flex justify-between items-center shadow-sm border-2 border-slate-50">
                    <div class="flex items-center gap-3">
                        <img src="${s.foto || 'https://ui-avatars.com/api/?name='+s.nama}" class="w-10 h-10 rounded-xl object-cover">
                        <p class="font-black text-slate-700">${s.nama}</p>
                    </div>
                    <button onclick="manageKarya('${s.id}')" class="kids-btn btn-secondary p-2 px-3 text-sm">Upload</button>
                </div>
            `).join('');

            let allPesan = [];
            appData.students.forEach(s => {
                if(s.percakapan) {
                    s.percakapan.forEach(p => {
                        if(!p.balasanGuru) allPesan.push({...p, studentName: s.nama});
                    });
                }
            });

            document.getElementById('admin-comment-log').innerHTML = allPesan.map(p => `
                <div class="bg-blue-50 p-4 rounded-2xl border-2 border-blue-100">
                    <p class="text-xs font-black text-blue-500 mb-1">DARI WALI: ${p.studentName}</p>
                    <p class="font-bold mb-3">"${p.pesanWali}"</p>
                    <div class="flex gap-2">
                        <input type="text" id="reply-to-${p.id}" placeholder="Balas..." class="flex-1 p-2 rounded-xl border-none outline-none font-bold">
                        <button onclick="sendReply('${p.id}')" class="kids-btn btn-secondary px-4">Kirim</button>
                    </div>
                </div>
            `).join('') || '<p class="text-center text-slate-300 font-bold">Semua pesan sudah terjawab! ✨</p>';
        }

        async function sendReply(cId) {
            const input = document.getElementById(`reply-to-${cId}`);
            if (!input.value.trim()) return;
            toggleLoading(true);
            try {
                await fetchWithRetry(API_URL, { 
                    method: 'POST', 
                    body: JSON.stringify({ action: 'replyComment', commentId: cId, replyText: input.value }),
                    mode: 'cors'
                });
                await fetchData();
            } catch(e) { alert("Gagal membalas"); }
            toggleLoading(false);
        }

        function manageKarya(id) {
            currentStudentId = id;
            const s = appData.students.find(x => x.id === id);
            document.getElementById('upload-modal-title').innerText = `Galeri ${s.nama}`;
            document.getElementById('admin-work-list').innerHTML = (s.karya || []).map(k => `
                <div class="flex items-center gap-3 p-3 bg-slate-50 rounded-xl mb-2">
                    <img src="${k.thumb === 'ICON_FALLBACK' ? 'https://via.placeholder.com/50?text=FILE' : k.thumb}" class="w-12 h-12 rounded-lg object-cover">
                    <p class="font-bold text-sm truncate flex-1">${k.judul}</p>
                    <span class="text-[10px] font-black text-slate-300">OK</span>
                </div>
            `).join('');
            showModal('modal-upload');
        }

        async function processUpload() {
            const judul = document.getElementById('up-judul').value;
            const fileInput = document.getElementById('up-file');
            const file = fileInput.files[0];

            if (!judul || !file) return alert("Ups! Judul atau file fotonya belum diisi nih.");

            // Validasi Ukuran (Maks 5MB untuk stabilitas Apps Script)
            if (file.size > 5 * 1024 * 1024) {
                return alert("File terlalu besar (Maks 5MB). Coba gunakan foto yang lebih kecil ya!");
            }

            toggleLoading(true);
            
            // Konversi file ke Base64 secara asinkron
            const reader = new FileReader();
            reader.onload = async (e) => {
                const base64 = e.target.result;
                try {
                    const result = await fetchWithRetry(API_URL, {
                        method: 'POST',
                        body: JSON.stringify({ 
                            action: 'uploadKarya', 
                            studentId: currentStudentId, 
                            judul, 
                            fileName: file.name, 
                            fileData: base64,
                            mimeType: file.type
                        }),
                        mode: 'cors'
                    });

                    if (result && result.success) {
                        alert("Berhasil! Karyamu sudah masuk galeri 🎨✨");
                        // Reset Form
                        document.getElementById('up-judul').value = "";
                        fileInput.value = "";
                        updateFileLabel();
                        hideModal('modal-upload');
                        await fetchData();
                    } else { 
                        alert("Gagal mengunggah: " + (result?.message || "Terjadi gangguan teknis.")); 
                    }
                } catch(e) { 
                    alert("Koneksi internet terputus. Coba lagi ya!"); 
                } finally {
                    toggleLoading(false);
                }
            };

            reader.onerror = () => {
                alert("Gagal membaca file foto.");
                toggleLoading(false);
            };

            reader.readAsDataURL(file);
        }

        async function saveStudent() {
            const nama = document.getElementById('st-nama').value;
            const pass = document.getElementById('st-pass').value;
            const foto = document.getElementById('st-foto').value;
            if (!nama || !pass) return alert("Lengkapi nama & PIN!");
            toggleLoading(true);
            try {
                await fetchWithRetry(API_URL, { 
                    method: 'POST', 
                    body: JSON.stringify({ action: 'addStudent', id: "S"+Date.now(), nama, pass, foto }),
                    mode: 'cors'
                });
                hideModal('modal-student');
                await fetchData();
            } catch(e) { alert("Gagal menyimpan data murid"); }
            toggleLoading(false);
        }

        window.onload = fetchData;
    </script>
</body>
</html>
